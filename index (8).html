<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1990 Alternative Rock Jukebox</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #2d2d2d;
            --accent-color: #ff4757;
            --text-color: #ffffff;
            --text-secondary: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        header p {
            color: var(--text-secondary);
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
            }
        }

        /* Jukebox Core Panel */
        .jukebox-panel {
            flex: 1;
            background-color: var(--panel-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Hidden video container - we only want the audio vibe */
        .video-placeholder {
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-placeholder iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .now-playing {
            text-align: center;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .now-playing h3 {
            margin: 0 0 5px 0;
            color: var(--accent-color);
        }

        /* Playlist Selection Panel */
        .playlist-panel {
            flex: 1.2;
            background-color: var(--panel-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-height: 600px;
            overflow-y: auto;
        }

        .track-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .track-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #3a3a3a;
            cursor: pointer;
            transition: background 0.2s ease;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .track-item:hover {
            background-color: #3a3a3a;
        }

        .track-item.active {
            background-color: rgba(255, 71, 87, 0.2);
            border: 1px solid var(--accent-color);
        }

        .track-index {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
            width: 40px;
        }

        .track-info {
            flex: 1;
        }

        .track-title {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .track-album {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Custom Scrollbar for Playlist */
        .playlist-panel::-webkit-scrollbar {
            width: 8px;
        }
        .playlist-panel::-webkit-scrollbar-track {
            background: var(--panel-color);
        }
        .playlist-panel::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>1990 Alt-Rock Jukebox</h1>
        <p>Streaming classic alternative anthems from the class of 1990</p>
    </header>

    <div class="container">
        <!-- Left Side: Player Status -->
        <div class="jukebox-panel">
            <div class="video-placeholder">
                <div id="player"></div>
            </div>
            <div class="now-playing">
                <p style="margin: 0 0 5px 0; font-size: 0.85rem; text-transform: uppercase; color: var(--text-secondary);">Now Spinning</p>
                <h3 id="current-title">Select a track to play</h3>
                <span id="current-album" style="color: var(--text-secondary); font-size: 0.9rem;">—</span>
            </div>
        </div>

        <!-- Right Side: Song Selection List -->
        <div class="playlist-panel">
            <ul class="track-list" id="track-list">
                <!-- Track items injected by JavaScript -->
            </ul>
        </div>
    </div>

    <!-- Load the YouTube IFrame Player API asynchronously -->
    <script>
        const tracks = [
            { title: "Been Caught Stealing", artist: "Jane's Addiction", album: "Ritual de lo Habitual", ytId: "Dx3YVwNre8E" },
            { title: "Here's Where the Story Ends", artist: "The Sundays", album: "Reading, Writing and Arithmetic", ytId: "FHSIZ6S7Gis" },
            { title: "Dig For Fire", artist: "Pixies", album: "Bossanova", ytId: "v3Z82mOThpE" },
            { title: "Ball and Chain", artist: "Social Distortion", album: "Social Distortion", ytId: "_NWjehpG60E" },
            { title: "Merry Go Round", artist: "The Replacements", album: "All Shook Down", ytId: "tO0c7e8yN-E" },
            { title: "Soon", artist: "My Bloody Valentine", album: "Glider EP", ytId: "dBvN9XU9v_U" },
            { title: "The Only One I Know", artist: "The Charlatans", album: "Some Friendly", ytId: "0RJwW77Lsj8" },
            { title: "Step On", artist: "Happy Mondays", album: "Pills 'n' Thrills and Bellyaches", ytId: "6M0IdXIn6S8" },
            { title: "Birdhouse in Your Soul", artist: "They Might Be Giants", album: "Flood", ytId: "Nhj3Z9kJ694" },
            { title: "Cool Enemy", artist: "The House of Love", album: "The House of Love", ytId: "e9CymmH-T-4" }
        ];

        let player;
        const trackListElement = document.getElementById('track-list');
        const currentTitleElement = document.getElementById('current-title');
        const currentAlbumElement = document.getElementById('current-album');

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script');
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function buildPlaylist() {
            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = 'track-item';
                li.dataset.index = index;
                li.dataset.ytid = track.ytId;
                
                li.innerHTML = `
                    <div class="track-index">${String(index + 1).padStart(2, '0')}</div>
                    <div class="track-info">
                        <div class="track-title">${track.artist} - ${track.title}</div>
                        <div class="track-album">${track.album}</div>
                    </div>
                `;
                
                li.addEventListener('click', () => selectTrack(index));
                trackListElement.appendChild(li);
            });
        }

        function onYouTubeIframeAPIReady() {
            buildPlaylist();
            
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: tracks[0].ytId,
                playerVars: {
                    'playsinline': 1,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
            
            updateUIState(0, false);
        }

        function selectTrack(index) {
            const track = tracks[index];
            player.loadVideoById(track.ytId);
            updateUIState(index, true);
        }

        function updateUIState(activeIndex, isPlaying) {
            document.querySelectorAll('.track-item').forEach((item, idx) => {
                if (idx === activeIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            const currentTrack = tracks[activeIndex];
            currentTitleElement.textContent = `${currentTrack.artist} — ${currentTrack.title}`;
            currentAlbumElement.textContent = `Album: ${currentTrack.album} (1990)`;
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                const currentYtId = player.getVideoData().video_id;
                const currentIndex = tracks.findIndex(t => t.ytId === currentYtId);
                const nextIndex = (currentIndex + 1) % tracks.length;
                selectTrack(nextIndex);
            }
        }
    </script>
</body>
</html>
